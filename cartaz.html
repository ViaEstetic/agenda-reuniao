<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartaz – Agenda da Sala de Reunião</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1d2330;
      background: #e9ebef;
    }
    .folha {
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      padding: 24mm 20mm;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10mm;
    }
    .logo { height: 18mm; width: auto; }
    h1 { font-size: 34pt; margin: 0; line-height: 1.1; }
    .sub { font-size: 17pt; color: #4a5263; margin: 0; max-width: 150mm; }
    .qr { width: 125mm; height: 125mm; }
    .passos { font-size: 14pt; color: #4a5263; margin: 0; padding: 0; list-style: none; line-height: 1.7; }
    .link { font-size: 12pt; color: #2f6fde; word-break: break-all; }
    .imprimir {
      position: fixed; top: 16px; right: 16px;
      font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
      background: #2f6fde; color: #fff; cursor: pointer;
    }
    @media print {
      body { background: #fff; }
      .folha { margin: 0; }
      .imprimir { display: none; }
    }
    @media (max-width: 220mm) {
      .folha { width: auto; min-height: 0; margin: 0; padding: 24px 16px; }
      .qr { width: min(125mm, 80vw); height: auto; }
      .imprimir { position: static; margin: 16px; }
    }
  </style>
</head>
<body>
  <button class="imprimir" type="button" onclick="print()">Imprimir</button>
  <div class="folha">
    <img class="logo" src="logo.png" alt="Viaestetic">
    <h1>Sala de Reunião</h1>
    <p class="sub">Antes de usar a sala, confira a agenda e faça sua reserva.</p>
    <img class="qr" src="qrcode.svg" alt="QR Code para a agenda da sala de reunião">
    <ul class="passos">
      <li>1. Aponte a câmera do celular para o código</li>
      <li>2. Escolha o dia e o horário livre</li>
      <li>3. Informe seu nome e salve</li>
    </ul>
    <p class="link">viaestetic.github.io/agenda-reuniao</p>
  </div>
</body>
</html>
