# Registra no Board Geral (Project 3 da ViaEstetic) cada mudança que entra no branch
# padrão, já em Done — prova do trabalho feito, sem depender do Claude nem da máquina.
#   - push que veio de PR mergeado: o PR entra no board (ou as issues que ele fecha);
#   - push direto: vira uma issue fechada em business-requirements com a lista de commits.
# Precisa do segredo BOARD_TOKEN no repositório (PAT com escopos `repo` e `project`).
# Arquivo igual em todos os repositórios da org; a cópia mestre fica no api-via.
name: Card no board

on:
  push:

permissions:
  contents: read

concurrency:
  group: card-no-board-${{ github.sha }}

jobs:
  card:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      contains(fromJSON('["Civalski"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
      ORG: ViaEstetic
      PROJETO: 3
      REPO_CARDS: ViaEstetic/business-requirements
    steps:
      - name: Criar ou atualizar o card
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Segredo BOARD_TOKEN ausente; card não criado."
            exit 0
          fi

          read -r PID FID DONE < <(gh api graphql \
            -f query='query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
            -F o="$ORG" -F n="$PROJETO" \
            --jq '.data.organization.projectV2 | [.id, .field.id, (.field.options[] | select(.name=="Done").id)] | @tsv')

          em_done() {
            local item
            item=$(gh api graphql \
              -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
              -f p="$PID" -f c="$1" --jq .data.addProjectV2ItemById.item.id)
            gh api graphql \
              -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
              -f p="$PID" -f i="$item" -f f="$FID" -f o="$DONE" > /dev/null
            echo "Card $item em Done."
          }

          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')

          if [ -n "$PR" ]; then
            echo "Push veio do PR #$PR."
            DADOS=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id closingIssuesReferences(first:10){nodes{id}}}}}' \
              -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$PR" \
              --jq '.data.repository.pullRequest')
            ISSUES=$(jq -r '.closingIssuesReferences.nodes[].id' <<<"$DADOS")
            if [ -n "$ISSUES" ]; then
              for i in $ISSUES; do em_done "$i"; done
            else
              em_done "$(jq -r .id <<<"$DADOS")"
            fi
            exit 0
          fi

          N=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          if [ "$N" -eq 0 ]; then echo "Push sem commits."; exit 0; fi

          REPO_NOME=${GITHUB_REPOSITORY#*/}
          PRIMEIRA=$(jq -r '.head_commit.message | split("\n")[0]' "$GITHUB_EVENT_PATH")
          TITULO="[$REPO_NOME] $PRIMEIRA"
          [ "$N" -gt 1 ] && TITULO="$TITULO (+$((N - 1)) commits)"
          DATA=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')

          {
            echo "Push direto no \`$GITHUB_REF_NAME\` de **$REPO_NOME** por $GITHUB_ACTOR em $DATA."
            echo
            jq -r '.commits[] | "- [`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0])"' "$GITHUB_EVENT_PATH"
            echo
            echo "Comparação: $(jq -r .compare "$GITHUB_EVENT_PATH")"
            echo
            echo "_Card criado pelo workflow Card no board._"
          } > corpo.md

          URL=$(gh issue create -R "$REPO_CARDS" --title "$TITULO" --body-file corpo.md --assignee "$GITHUB_ACTOR")
          gh issue close "$URL" --reason completed > /dev/null
          em_done "$(gh issue view "$URL" --json id --jq .id)"
          echo "Issue: $URL"
